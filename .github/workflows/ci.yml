name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Pull-request runs supersede each other: only the newest push to a PR branch
# needs an answer, and the run it cancels belongs to a sha nobody will merge.
#
# Post-merge runs on main are not interchangeable that way. Each one is the
# record of what a single merge commit shipped, and two merges landing a minute
# apart share a ref, so the old grouping had the second merge cancel the first.
# A cancelled run is recorded as a red check against the commit it superseded --
# see 1622ed7 (F5), cancelled 17s in by the R2 merge and still carrying an X for
# code that was never judged. So push runs get a group per sha and are never
# cancelled: the record of a merge is always that merge's own result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      # AGENTS.md: install must always run under npm 10.9.7, never whatever
      # npm ships with the chosen Node version. npm 11 strips Vitest's nested
      # esbuild records from package-lock.json, breaking `npm ci` on
      # Webflow Cloud.
      - name: Pin npm to 10.9.7
        run: npm install -g npm@10.9.7

      - name: Print tool versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Runs before `build` deliberately: `build` writes .next/types/*, which
      # tsconfig.json's include picks up, so typechecking after a build
      # checks generated route types too. Checking source-only first keeps
      # this step's result independent of a prior build in the same job.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Typecheck collector worker
        run: npm run collector:check

      - name: Dry-run collector worker deploy
        run: npm run collector:dry-run

      - name: Typecheck auth gateway
        run: npm run gateway:check

      - name: Dry-run auth gateway deploy
        run: npm run gateway:dry-run
